apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarthome-microservice_deployment_019
  namespace: smarthome-prod
  labels:
    app.kubernetes.io/name: smarthome-microservice_deployment_019
    app.kubernetes.io/part-of: smart-home-platform
    app.kubernetes.io/version: "2.4.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smarthome-microservice_deployment_019
  template:
    metadata:
      labels:
        app: smarthome-microservice_deployment_019
    spec:
      containers:
      - name: service-runtime
        image: smarthome/service-microservice_deployment_019:v2.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: smarthome-microservice_deployment_019-svc
  namespace: smarthome-prod
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: smarthome-microservice_deployment_019
